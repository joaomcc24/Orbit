name: orbit-integration-tests

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: orbit_test
      POSTGRES_PASSWORD: orbit_test
      POSTGRES_DB: orbit_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_test -d orbit_test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
